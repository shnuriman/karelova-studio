  <script>
  // iOS PWA: реальна висота екрана для фіксованої розкладки (меню завжди внизу)
  (function(){
    var st = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    if(!st) return;
    function set(){
      var p = matchMedia('(orientation: portrait)').matches;
      var full = p ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      var ih = window.innerHeight;
      var root = document.documentElement.style;
      // сторінці належить лише innerHeight: усе, що нижче, iOS обрізає
      root.setProperty('--app-h', ih + 'px');
      // скільки px знизу екрана iOS не віддає сторінці (0 на нормальних пристроях)
      root.setProperty('--strip', Math.max(0, full - ih) + 'px');
    }
    set();
    addEventListener('resize', set);
    addEventListener('orientationchange', function(){ setTimeout(set, 250); });
    addEventListener('pageshow', set);
  })();
  </script>
